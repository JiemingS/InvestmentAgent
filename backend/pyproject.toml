[project]
name = "investment-agent"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "exchange-calendars>=4.11,<5",
    "fastapi>=0.135,<1",
    "httpx>=0.28,<1",
    "httpx2>=2,<3",
    "icalendar>=6,<8",
    "mcp>=2.3,<3",
    "mcp-server-fetch==2026.11.4",
    "tzdata>=2025.3",
    "uvicorn>=0.40,<1",
    "yfinance>=1.8,<2",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
